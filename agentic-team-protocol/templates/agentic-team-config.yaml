# Agentic Team Protocol configuration for <PROJECT_NAME>

project: <PROJECT_PATH>
charter_path: .claude/agentic-team-charter.md

active_roles:
  - dispatcher
  - researcher
  - builder
  - verifier
  - archivist

# Runtime is available but gated; include it only when live-system work is expected.
# - runtime

# Router is a harness-level controller used by /team-continue to resume goals.
# It is always available and does not need to be listed in active_roles.

default_package_type: build

branch_policy:
  default_branch: <DEFAULT_BRANCH>
  feature_branch_required_for: [build, run]
  allowed_direct_on_default: trivial_one_line_fixes
  merge_strategy: non_fast_forward_merge
  record_parent_shas: true

overrides:
  # Project-local skill, agents, and commands override global ones.
  use_local_skill: true
  use_local_agents: true
  use_local_commands: true

escalation:
  status_period: 1h
  chair_same_day: true
  founders_circle_48h: true

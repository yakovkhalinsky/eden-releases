name: eden-memory monorepo Public Release (manual fallback)

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Source tag in eden-memory (e.g. v0.3.18)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Promote existing eden-memory monorepo release
    runs-on: ubuntu-latest
    steps:
      - name: Generate cross-repo token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            eden-memory
            eden-releases

      - name: Checkout eden-releases
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      - name: Install GitHub CLI
        run: |
          type gh >/dev/null 2>&1 || (apt-get update && apt-get install -y gh)

      - name: Download source release assets
        run: |
          mkdir -p public-binaries
          gh release download "${{ github.event.inputs.source_tag }}" \
            --repo ${{ github.repository_owner }}/eden-memory \
            --dir public-binaries \
            --pattern 'eden-memory-*' \
            --pattern 'eden-relay-*' \
            --pattern 'eden-team-*'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}

      - name: Create skills tarball
        run: |
          tar -czf "eden-memory-skills.tar.gz" \
            skills/ \
            scripts/setup-claude.sh \
            scripts/setup-hermes.sh \
            scripts/setup-cursor.json

      - name: Generate SHA-256 checksums
        working-directory: public-binaries
        run: |
          for f in eden-memory-* eden-relay-* eden-team-*; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - name: Regenerate manifest and download metadata
        run: |
          python3 scripts/generate-download-metadata.py \
            --tag "${{ github.event.inputs.source_tag }}" \
            --assets-dir public-binaries

      - name: Publish eden-memory VERSION and checksum files
        run: |
          VERSION="${{ github.event.inputs.source_tag }}"
          VERSION="${VERSION#v}"
          mkdir -p docs-site/public/eden-memory
          printf '%s\n' "${VERSION}" > docs-site/public/eden-memory/VERSION
          for f in public-binaries/eden-memory-*.sha256; do
            [ -f "$f" ] || continue
            cp "$f" "docs-site/public/eden-memory/$(basename "$f")"
          done

      - name: Commit and push metadata
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add binaries/manifest.json docs-site/src/data/downloads.json docs-site/public/eden-memory/VERSION docs-site/public/eden-memory/eden-memory-*.sha256
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
          else
            VERSION="${{ github.event.inputs.source_tag }}"
            git commit -m "Publish eden-memory monorepo ${VERSION}"
            for attempt in 1 2 3; do
              echo "Attempt $attempt: rebasing onto origin/main and pushing..."
              git fetch origin main
              git rebase origin/main || { echo "Rebase failed"; exit 1; }
              if git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}/eden-releases.git" main; then
                echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 5
            done
            echo "Push to eden-releases rejected after 3 attempts." >&2
            exit 1
          fi
        env:
          TOKEN: ${{ steps.token.outputs.token }}

      - name: Create or update public release
        if: steps.publish.outputs.sha != ''
        uses: ncipollo/release-action@v1
        with:
          repo: eden-releases
          owner: ${{ github.repository_owner }}
          token: ${{ steps.token.outputs.token }}
          tag: ${{ github.event.inputs.source_tag }}
          commit: ${{ steps.publish.outputs.sha }}
          name: Eden ${{ github.event.inputs.source_tag }}
          body: |
            This release ships three binaries from the Eden project:
            - `eden-memory` — the full CLI with MCP server, memory tools, sync, and pairing.
            - `eden-relay` — a dedicated, lightweight relay server.
            - `eden-team` — a headless ATP supervisor.
          generateReleaseNotes: true
          artifacts: "public-binaries/eden-memory-*,public-binaries/eden-relay-*,public-binaries/eden-team-*,eden-memory-skills.tar.gz"
          artifactErrorsFailBuild: true
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true

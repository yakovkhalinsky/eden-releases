name: ATP version check

on:
  pull_request:
    paths:
      - 'agentic_team_protocol/**'
      - 'scripts/set-atp-version.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ATP version consistency
        run: node scripts/set-atp-version.js --check
